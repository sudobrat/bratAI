name: brat ai deployment

on:
    push:
        branches:
            - main

    workflow_dispatch:
        inputs:
            action:
                description: "Choose Terraform Action (apply to build, destroy to delete)"
                required: true
                default: "apply"
                type: choice
                options:
                    - apply
                    - destroy

jobs:
    terraform:
        name: "Terraform Infrastructure"
        runs-on: ubuntu-latest

        outputs:
            gateway_url: ${{ steps.tf-out.outputs.url }}
            static_web_app_api_token: ${{ steps.tf-out.outputs.token }}
            frontend_hostname: ${{ steps.tf-out.outputs.frontend_hostname }}

        defaults:
            run:
                working-directory: ./terraform

        env:
            ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
            ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
            ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
            ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

            TF_VAR_mongodb_base_uri: ${{ secrets.TF_VAR_MONGODB_BASE_URI }}
            TF_VAR_razorpay_key_id: ${{ secrets.TF_VAR_RAZORPAY_KEY_ID }}
            TF_VAR_razorpay_key_secret: ${{ secrets.TF_VAR_RAZORPAY_KEY_SECRET }}
            TF_VAR_groq_api_key: ${{ secrets.TF_VAR_GROQ_API_KEY }}
            TF_VAR_google_api_key: ${{ secrets.TF_VAR_GOOGLE_API_KEY }}
            TF_VAR_tavily_api_key: ${{ secrets.TF_VAR_TAVILY_API_KEY }}
            TF_VAR_openrouter_api_key: ${{ secrets.TF_VAR_OPENROUTER_API_KEY }}
            TF_VAR_qdrant_url: ${{ secrets.TF_VAR_QDRANT_URL }}
            TF_VAR_qdrant_api_key: ${{ secrets.TF_VAR_QDRANT_API_KEY }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Log into Azure
              uses: azure/login@v2
              with:
                  creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4

            - name: Terraform Init
              run: terraform init

            - name: Terraform Apply
              if: github.event_name == 'push' || github.event.inputs.action == 'apply'
              run: terraform apply -auto-approve

            - name: Export Outputs
              id: tf-out
              if: github.event_name == 'push' || github.event.inputs.action == 'apply'
              run: |
                  echo "url=$(terraform output -raw gateway_url)" >> $GITHUB_OUTPUT
                  echo "token=$(terraform output -raw static_web_app_api_token)" >> $GITHUB_OUTPUT
                  echo "frontend_hostname=$(terraform output -raw frontend_hostname)" >> $GITHUB_OUTPUT

            - name: Terraform Destroy
              if: github.event.inputs.action == 'destroy'
              run: terraform destroy -auto-approve

    build-and-push:
        name: "Build and Push Docker Images"
        needs: terraform
        runs-on: ubuntu-latest

        if: github.event_name == 'push' || github.event.inputs.action == 'apply'

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Log into Azure
              uses: azure/login@v2
              with:
                  creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

            - name: Log into Azure Container Registry (ACR)
              run: az acr login --name brataiacr123

            # --- GATEWAY SERVICE ---
            - name: Build Gateway
              run: docker build -f backend/gateway/Dockerfile -t gateway backend
            - name: Tag & Push Gateway
              run: |
                  docker tag gateway:latest brataiacr123.azurecr.io/gateway:latest
                  docker push brataiacr123.azurecr.io/gateway:latest

            # --- INJECT FIREBASE CREDENTIALS ---
            - name: Inject Firebase Credentials
              run: |
                  # This creates the file dynamically in the runner
                  echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > backend/services/auth/serviceAccountKey.json

            # --- AUTH SERVICE ---
            - name: Build Auth Service
              run: docker build -f backend/services/auth/Dockerfile -t auth-service backend
            - name: Tag & Push Auth Service
              run: |
                  docker tag auth-service:latest brataiacr123.azurecr.io/auth:latest
                  docker push brataiacr123.azurecr.io/auth:latest

            # --- CHAT SERVICE ---
            - name: Build Chat Service
              run: docker build -f backend/services/chat/Dockerfile -t chat-service backend
            - name: Tag & Push Chat Service
              run: |
                  docker tag chat-service:latest brataiacr123.azurecr.io/chat:latest
                  docker push brataiacr123.azurecr.io/chat:latest

            # --- AGENT SERVICE ---
            - name: Build Agent Service
              run: docker build -f backend/services/agent/Dockerfile -t agent-service backend
            - name: Tag & Push Agent Service
              run: |
                  docker tag agent-service:latest brataiacr123.azurecr.io/agent:latest
                  docker push brataiacr123.azurecr.io/agent:latest

            # --- BILLING SERVICE ---
            - name: Build Billing Service
              run: docker build -f backend/services/billing/Dockerfile -t billing-service backend
            - name: Tag & Push Billing Service
              run: |
                  docker tag billing-service:latest brataiacr123.azurecr.io/billing:latest
                  docker push brataiacr123.azurecr.io/billing:latest

            # --- UPDATE APPS WITH NEW IMAGES ---
            - name: Update Container Apps
              run: |
                  az containerapp update -n gateway-service -g bratai-rg --image brataiacr123.azurecr.io/gateway:latest
                  az containerapp update -n auth-service -g bratai-rg --image brataiacr123.azurecr.io/auth:latest
                  az containerapp update -n chat-service -g bratai-rg --image brataiacr123.azurecr.io/chat:latest
                  az containerapp update -n agent-service -g bratai-rg --image brataiacr123.azurecr.io/agent:latest
                  az containerapp update -n billing-service -g bratai-rg --image brataiacr123.azurecr.io/billing:latest

    deploy-frontend:
        name: "Deploy React Frontend"
        needs: terraform
        runs-on: ubuntu-latest

        if: github.event_name == 'push' || github.event.inputs.action == 'apply'

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            # We need the Gateway URL that Terraform generated so the frontend can talk to it!
            - name: Get Frontend ENV Variables
              run: |
                  echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> $GITHUB_ENV
                  echo "VITE_RAZORPAY_KEY_ID=${{ secrets.TF_VAR_RAZORPAY_KEY_ID }}" >> $GITHUB_ENV
                  echo "VITE_SERVER_URL=${{ needs.terraform.outputs.gateway_url }}" >> $GITHUB_ENV

            # Azure handles the npm install, npm run build, and the uploading for us!
            - name: Build And Deploy to Azure Static Web Apps
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ needs.terraform.outputs.static_web_app_api_token }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  action: "upload"
                  app_location: "/frontend" # Where your React app lives
                  api_location: "" # Leave empty since we built our own backend
                  output_location: "dist" # The folder Vite outputs to

            - name: Update GoDaddy DNS
              run: |
                  curl -X PUT "https://api.godaddy.com/v1/domains/bharatrajsingal.online/records/CNAME/bratai" \
                  -H "Authorization: sso-key ${{ secrets.GODADDY_PAT }}" \
                  -H "Content-Type: application/json" \
                  -d '[{"data": "${{ needs.terraform.outputs.frontend_hostname }}", "ttl": 600}]'
                  
            - name: Log into Azure for Custom Domain Binding
              uses: azure/login@v2
              with:
                  creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

            - name: Wait for DNS and Bind Custom Domain
              run: |
                  echo "Waiting for GoDaddy DNS to propagate (this can take a couple of minutes)..."
                  for i in {1..12}; do
                      if az staticwebapp hostname set --name bratai-frontend -g bratai-rg --hostname bratai.bharatrajsingal.online; then
                          echo "Successfully bound custom domain!"
                          exit 0
                      fi
                      echo "DNS not propagated yet, waiting 30 seconds..."
                      sleep 30
                  done
                  echo "Failed to bind custom domain within the time limit. You may need to retry manually later."
                  exit 1
